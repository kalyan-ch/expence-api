
spring:
  application:
    name: expenceApi
  config:
    # Secrets (the Discord webhook) live in an untracked .env next to build.gradle; see .env.example.
    # Real environment variables still win over it.
    import: optional:file:.env[.properties]
  profiles:
    active: local
  jpa:
    show-sql: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks the entities match it and never
      # writes DDL, so the database can never drift from the migrations.
      ddl-auto: validate

server:
  port: ${PORT:8081}

app:
  cors:
    # Single-user local app: the UI is always Next.js on :3000. True in every profile,
    # so it lives here rather than being repeated per profile.
    allowed-origins: http://localhost:3000

  notify:
    # A Discord channel webhook (Channel settings > Integrations > Webhooks). It lets anyone post
    # to the channel, so it comes from .env or the environment, never from git. Blank turns reminders off.
    webhook-url: ${DISCORD_WEBHOOK_URL:}
    cron: '0 0 8 * * *'
    # Blank means the machine's own time zone.
    zone: ${NOTIFY_ZONE:}
    # Bills due within this many days make the digest.
    lead-days: 3
    app-url: http://localhost:3000
