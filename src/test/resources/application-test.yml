
# Only what must differ from the local profile. The datasource is deliberately absent:
# @ServiceConnection on the Testcontainers Postgres in AbstractIntegrationTest supplies
# the URL, user and password, so the suite never points at the local dev database.
spring:
  flyway:
    locations: classpath:db/migration

# A developer's .env may hold a real webhook; tests must never post to it.
app:
  notify:
    webhook-url: ''
