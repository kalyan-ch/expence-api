plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.expence'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.postgresql:postgresql'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'

	// Tests run against a real Postgres in Docker, not H2: the schema uses
	// gen_random_uuid(), a plpgsql trigger and multi-column CHECK constraints that
	// H2 cannot reproduce, and Flyway stays on so the migrations are exercised too.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Boot 4.1 moved MockMvc's test slice out of spring-boot-test-autoconfigure into its
	// own module, so spring-boot-starter-test alone no longer provides @AutoConfigureMockMvc.
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Testcontainers 2.x (2.0.5, pinned by the Spring Boot 4.1.0 BOM) prefixes every
	// module artifact with 'testcontainers-'. The spec's 'org.testcontainers:postgresql'
	// and ':junit-jupiter' are the 1.x names and no longer resolve.
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
