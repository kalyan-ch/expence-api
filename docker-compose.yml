services:
  postgres-db:
    image: postgres:16.4-alpine
    container_name: expence-postgres
    restart: always
    # Listen on 5434 inside the container too, so the 5434:5434 mapping lines up.
    command: -p 5434
    environment:
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=postgresDev
      - POSTGRES_DB=expence
    ports:
      - '5434:5434'
    volumes:
      - expence-pgdata:/var/lib/postgresql/data

volumes:
  expence-pgdata:
