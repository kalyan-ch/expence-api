services:
  postgres-db:
    image: postgres:16.4-alpine
    container_name: expence-postgres
    restart: always
    environment:
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=postgresDev
      - POSTGRES_DB=expence
    ports:
      - '5432:5432'
    volumes:
      - expence-pgdata:/var/lib/postgresql/data

volumes:
  expence-pgdata:
