services:
  postgres-db:
    image: postgres:16.4-alpine
    container_name: expence-postgres
    restart: always
    # Listen on 5433 inside the container too, so the 5433:5433 mapping lines up.
    command: -p 5433
    environment:
      - POSTGRES_USER=developer
      - POSTGRES_PASSWORD=postgresDev
      - POSTGRES_DB=expence
    ports:
      - '5433:5433'
    volumes:
      - expence-pgdata:/var/lib/postgresql/data

volumes:
  expence-pgdata:
